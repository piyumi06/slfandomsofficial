<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | SLFN</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff7fb;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .checkout-box {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .event-name {
            background: #ffe4ef;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
        }

        h2 {
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .ticket-display {
            background: #fff1f7;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .ticket-display p {
            margin: 7px 0;
        }

        .total {
            margin-top: 25px;
            padding: 15px;
            background: #fff1f7;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .continue-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #f4c542;
            color: #222;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .continue-btn:hover {
            opacity: 0.9;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="checkout-box">

        <h1>Checkout</h1>


        <!-- EVENT -->

        <div class="event-name" id="eventName">
            Loading event...
        </div>


        <!-- TICKET -->

        <h2>Ticket Details</h2>

        <div class="ticket-display">

            <p>
                <strong>Ticket Type:</strong>
                <span id="ticketName">
                    Loading...
                </span>
            </p>

            <p>
                <strong>Price:</strong>
                Rs.
                <span id="ticketPrice">
                    0
                </span>
            </p>

            <p>
                <strong>Available:</strong>
                <span id="ticketAvailable">
                    0
                </span>
            </p>

        </div>


        <label for="quantity">
            Quantity
        </label>

        <input
            type="number"
            id="quantity"
            min="1"
            value="1"
        >


        <!-- CUSTOMER DETAILS -->

        <h2>Customer Details</h2>


        <label for="fullName">
            Full Name
        </label>

        <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
        >


        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="example@email.com"
            required
        >


        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="07XXXXXXXX"
            required
        >


        <!-- TOTAL -->

        <div class="total">

            Total: Rs.
            <span id="total">
                0
            </span>

        </div>


        <!-- CONTINUE -->

        <button
            class="continue-btn"
            onclick="continueCheckout()"
        >
            Continue to Payment
        </button>


        <a href="events.html" class="back">
            ← Back to Events
        </a>

    </div>

</div>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    // SUPABASE

    const SUPABASE_URL =
        "https://ixjzimaqsgrpcwzidcgx.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_DKTtTNjxkbrsWzQYqm_EEA_2Q6TLzZI";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // GET TICKET ID FROM URL

    const params =
        new URLSearchParams(
            window.location.search
        );

    const ticketId =
        params.get("ticket_id");


    // STORE SELECTED TICKET

    let selectedTicket = null;


    // =========================
    // LOAD TICKET
    // =========================

    async function loadTicket() {

        if (!ticketId) {

            document.getElementById("eventName").textContent =
                "Ticket not found";

            return;
        }


        const { data: ticket, error } =
            await supabaseClient

                .from("ticket_types")

                .select("*")

                .eq("id", ticketId)

                .single();


        if (error) {

            console.error(
                "Error loading ticket:",
                error
            );

            document.getElementById("eventName").textContent =
                "Unable to load ticket";

            return;
        }


        selectedTicket = ticket;


        console.log(
            "Ticket loaded:",
            ticket
        );


        // Show ticket information

        document.getElementById("ticketName").textContent =
            ticket.name;


        document.getElementById("ticketPrice").textContent =
            Number(ticket.price).toLocaleString();


        document.getElementById("ticketAvailable").textContent =
            ticket.quantity;


        updateTotal();


        // =========================
        // LOAD EVENT
        // =========================

        const { data: event, error: eventError } =
            await supabaseClient

                .from("events")

                .select("*")

                .eq("id", ticket.event_id)

                .single();


        if (eventError) {

            console.error(
                "Error loading event:",
                eventError
            );

            document.getElementById("eventName").textContent =
                "Event not found";

            return;
        }


        document.getElementById("eventName").textContent =
            event.title;

    }


    // =========================
    // CALCULATE TOTAL
    // =========================

    function updateTotal() {

        if (!selectedTicket) {
            return;
        }


        const price =
            Number(selectedTicket.price);


        const quantity =
            Number(
                document.getElementById("quantity").value
            );


        const total =
            price * quantity;


        document.getElementById("total").textContent =
            total.toLocaleString();

    }


    document
        .getElementById("quantity")
        .addEventListener(
            "input",
            updateTotal
        );


    // =========================
    // CONTINUE
    // =========================

async function continueCheckout() {

    const name =
        document.getElementById("fullName").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const quantity =
        Number(
            document.getElementById("quantity").value
        );


    // Check customer details

    if (!name || !email || !phone) {

        alert(
            "Please fill in all customer details."
        );

        return;
    }


    // Check ticket

    if (!selectedTicket) {

        alert(
            "Ticket information is not loaded."
        );

        return;
    }


    // Check quantity

    if (
        quantity < 1 ||
        quantity > selectedTicket.quantity
    ) {

        alert(
            "Please enter a valid ticket quantity."
        );

        return;
    }


    // Calculate total

    const unitPrice =
        Number(selectedTicket.price);

    const totalAmount =
        unitPrice * quantity;


    // Disable button while saving

    const button =
        document.querySelector(".continue-btn");

    button.disabled = true;

    button.textContent =
        "Creating Order...";


    // =========================
    // CREATE ORDER
    // =========================

    const { data: order, error: orderError } =
        await supabaseClient

            .from("orders")

            .insert([{

                event_id: selectedTicket.event_id,

                customer_name: name,

                customer_email: email,

                customer_phone: phone,

                total_amount: totalAmount,

                payment_status: "pending",

                payment_ref: null

            }])

            .select()

            .single();


    if (orderError) {

        console.error(
            "Error creating order:",
            orderError
        );

        alert(
            "Unable to create order. Please try again."
        );

        button.disabled = false;

        button.textContent =
            "Continue to Payment";

        return;
    }


    console.log(
        "Order created:",
        order
    );


    // =========================
    // CREATE ORDER ITEM
    // =========================

    const { data: orderItem, error: itemError } =
        await supabaseClient

            .from("order_items")

            .insert([{

                order_id: order.id,

                ticket_type_id:
                    selectedTicket.id,

                quantity: quantity,

                unit_price: unitPrice

            }])

            .select()

            .single();


    if (itemError) {

        console.error(
            "Error creating order item:",
            itemError
        );

        alert(
            "Order was created, but the ticket information could not be saved."
        );

        button.disabled = false;

        button.textContent =
            "Continue to Payment";

        return;
    }


    console.log(
        "Order item created:",
        orderItem
    );


    // =========================
    // TEMPORARY SUCCESS
    // =========================

    alert(
        "Order created successfully! Payment will be added next."
    );


    console.log(
        "Order ID:",
        order.id
    );

}
    // START

    loadTicket();

</script>

</body>

</html>
