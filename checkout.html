<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Echoes of Siam</title>

    <link rel="stylesheet" href="ticketing.css">
</head>

<body>

<header>
    <div class="logo">SLFN</div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="events.html">Event</a>
    </nav>
</header>


<main class="checkout-page">

    <h1>Get Your Ticket</h1>

    <p class="checkout-subtitle">
        Echoes of Siam — November 24
    </p>

<form
    class="checkout-form"
    action="https://formspree.io/f/mnparvoj/"
    method="POST"
>

     

        <section class="checkout-section">

            <h2>Your Information</h2>

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >

        </section>



        <section class="checkout-section">

            <h2>Ticket Details</h2>


            <label for="quantity">
                Quantity
            </label>

            <input
                type="number"
                id="quantity"
                name="quantity"
                min="1"
                max="10"
                value="1"
                required
            >

        </section>


        <button type="submit" class="checkout-button">
            Register
        </button>

    </form>

</main>


<footer>
    <p>© 2026 Sri Lankan Fandom Network</p>
</footer>

</body>
</html>
