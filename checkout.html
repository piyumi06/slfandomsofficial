<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | SLFN</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff7fb;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .checkout-box {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .event-name {
            background: #ffe4ef;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .total {
            margin-top: 25px;
            padding: 15px;
            background: #fff1f7;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .continue-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #f4c542;
            color: #222;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .continue-btn:hover {
            opacity: 0.9;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="checkout-box">

        <h1>Checkout</h1>

        <div class="event-name" id="eventName">
            Loading event...
        </div>

        <label for="ticketType">Ticket Type</label>

        <select id="ticketType">
            <option value="2600">Early Bird — Rs. 2,600</option>
            <option value="2800">Standard — Rs. 2,800</option>
        </select>

        <label for="quantity">Quantity</label>

        <input
            type="number"
            id="quantity"
            min="1"
            value="1"
        >

        <div class="total">
            Total: Rs. <span id="total">2600</span>
        </div>

        <button class="continue-btn" onclick="continueCheckout()">
            Continue
        </button>

        <a href="events.html" class="back">
            ← Back to Events
        </a>

    </div>

</div>


<script>

    // Get event ID from URL
    const params = new URLSearchParams(window.location.search);

    const eventId = params.get("event");

    // Temporary event data
    const events = {

        "echoes-of-siam": {
            name: "Echoes of Siam 2026"
        },

        "test-event": {
            name: "SLFN Test Event"
        }

    };


    // Display event name
    if (eventId && events[eventId]) {

        document.getElementById("eventName").textContent =
            events[eventId].name;

    } else {

        document.getElementById("eventName").textContent =
            "Event not found";

    }


    // Calculate total
    function updateTotal() {

        const price =
            Number(document.getElementById("ticketType").value);

        const quantity =
            Number(document.getElementById("quantity").value);

        const total = price * quantity;

        document.getElementById("total").textContent =
            total.toLocaleString();

    }


    document.getElementById("ticketType")
        .addEventListener("change", updateTotal);

    document.getElementById("quantity")
        .addEventListener("input", updateTotal);


    // Continue button
    function continueCheckout() {

        const ticketType =
            document.getElementById("ticketType").value;

        const quantity =
            document.getElementById("quantity").value;

        const url =
            `checkout.html?event=${eventId}&ticket=${ticketType}&quantity=${quantity}`;

        console.log("Checkout:", url);

        alert("Checkout information saved!");

    }

</script>

</body>
</html>
