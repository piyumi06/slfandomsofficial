<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SLFN Admin Dashboard</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff7fb;
            color: #333;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: #f4c542;
            padding: 20px;
        }


        header h1 {
            font-size: 24px;
        }


        header p {
            margin-top: 5px;
            font-size: 14px;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px;
        }


        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }


        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }


        .stat-card h3 {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }


        .stat-card p {
            font-size: 25px;
            font-weight: bold;
        }


        /* =========================
           SECTIONS
        ========================= */

        section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }


        section h2 {
            margin-bottom: 20px;
        }


        /* =========================
           EVENTS
        ========================= */

        .event-card {
            background: #fff1f7;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }


        .event-card h3 {
            margin-bottom: 10px;
        }


        .event-card p {
            margin-bottom: 6px;
        }


        .event-status {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 10px;
            border-radius: 20px;
            background: #d4edda;
            font-size: 12px;
            font-weight: bold;
        }


        /* =========================
           BUTTON
        ========================= */

        button {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #f4c542;
            cursor: pointer;
            font-weight: bold;
        }


        button:hover {
            opacity: 0.85;
        }


        /* =========================
           ORDERS
        ========================= */

        .order {
            border: 1px solid #eee;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 12px;
        }


        .order h3 {
            margin-bottom: 10px;
        }


        .order p {
            margin-bottom: 6px;
        }


        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }


        .status.pending {
            background: #fff3cd;
            color: #856404;
        }


        .status.paid {
            background: #d4edda;
            color: #155724;
        }


        .status.failed,
        .status.cancelled {
            background: #f8d7da;
            color: #721c24;
        }


        /* =========================
           EMPTY / LOADING / ERROR
        ========================= */

        .empty {
            color: #777;
        }


        .loading {
            color: #777;
        }


        .error {
            color: #721c24;
            background: #f8d7da;
            padding: 15px;
            border-radius: 10px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>SLFN Admin</h1>

    <p>Sri Lankan Fandom Network</p>

</header>



<div class="container">


    <!-- =========================
         DASHBOARD STATS
    ========================= -->

    <div class="stats">


        <div class="stat-card">

            <h3>Active Events</h3>

            <p id="activeEvents">
                Loading...
            </p>

        </div>



        <div class="stat-card">

            <h3>Tickets Sold</h3>

            <p id="ticketsSold">
                Loading...
            </p>

        </div>



        <div class="stat-card">

            <h3>Revenue</h3>

            <p id="revenue">
                Loading...
            </p>

        </div>


    </div>



    <!-- =========================
         EVENTS
    ========================= -->

    <section>

        <h2>Events</h2>

        <div id="eventsList">

            <p class="loading">
                Loading events...
            </p>

        </div>

    </section>



    <!-- =========================
         ORDERS
    ========================= -->

    <section>

        <h2>Orders</h2>

        <div id="ordersList">

            <p class="loading">
                Loading orders...
            </p>

        </div>

    </section>



    <!-- =========================
         CHECK-IN
    ========================= -->

    <section>

        <h2>Check-in</h2>

        <p class="empty">
            Ticket check-in system will appear here.
        </p>

    </section>


</div>



<script>


    // =====================================================
    // SUPABASE CONFIGURATION
    // =====================================================

    const SUPABASE_URL =
        "https://ixjzimaqsgrpcwzidcgx.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_DKTtTNjxkbrsWzQYqm_EEA_2Q6TLzZI";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );



    // =====================================================
    // LOAD EVENTS
    // =====================================================

    async function loadEvents() {


        const eventsList =
            document.getElementById("eventsList");


        const { data, error } =
            await supabaseClient
                .from("events")
                .select("*")
                .order("event_date", {
                    ascending: true
                });


        if (error) {

            console.error("Events error:", error);


            eventsList.innerHTML = `

                <div class="error">

                    Unable to load events.

                    <br><br>

                    ${error.message}

                </div>

            `;

            return;

        }


        // Active event count

        const activeEvents =
            data.filter(
                event => event.status === "active"
            ).length;


        document.getElementById("activeEvents")
            .textContent = activeEvents;



        // No events

        if (!data || data.length === 0) {

            eventsList.innerHTML = `

                <p class="empty">
                    No events found.
                </p>

            `;

            return;

        }



        // Clear loading

        eventsList.innerHTML = "";



        // Display every event

        data.forEach(event => {


            const eventCard =
                document.createElement("div");


            eventCard.className =
                "event-card";



            eventCard.innerHTML = `

                <h3>
                    ${escapeHTML(event.title)}
                </h3>

                <p>
                    <strong>Date:</strong>
                    ${escapeHTML(event.event_date || "Not set")}
                </p>

                <p>
                    <strong>Time:</strong>
                    ${escapeHTML(event.event_time || "Not set")}
                </p>

                <p>
                    <strong>Venue:</strong>
                    ${escapeHTML(event.venue || "Not set")}
                </p>

                <p>
                    <strong>Event ID:</strong>
                    ${event.id}
                </p>

                <span class="event-status">

                    ${escapeHTML(event.status || "unknown")}

                </span>

                <br>

                <button
                    onclick="manageEvent(${event.id})">

                    Manage Event

                </button>

            `;


            eventsList.appendChild(eventCard);

        });

    }



    // =====================================================
    // LOAD ORDERS
    // =====================================================

    async function loadOrders() {


        const ordersList =
            document.getElementById("ordersList");


        // Get orders

        const { data: orders, error: ordersError } =
            await supabaseClient
                .from("orders")
                .select("*")
                .order("created_at", {
                    ascending: false
                });


        if (ordersError) {

            console.error(
                "Orders error:",
                ordersError
            );


            ordersList.innerHTML = `

                <div class="error">

                    Unable to load orders.

                    <br><br>

                    ${ordersError.message}

                </div>

            `;

            return;

        }



        // No orders

        if (!orders || orders.length === 0) {

            ordersList.innerHTML = `

                <p class="empty">
                    No orders yet.
                </p>

            `;

            return;

        }



        // Get order items

        const { data: orderItems, error: itemsError } =
            await supabaseClient
                .from("order_items")
                .select("*");


        if (itemsError) {

            console.error(
                "Order items error:",
                itemsError
            );


            ordersList.innerHTML = `

                <div class="error">

                    Unable to load order items.

                    <br><br>

                    ${itemsError.message}

                </div>

            `;

            return;

        }



        // Get ticket types

        const { data: ticketTypes, error: typesError } =
            await supabaseClient
                .from("ticket_types")
                .select("*");


        if (typesError) {

            console.error(
                "Ticket types error:",
                typesError
            );


            ordersList.innerHTML = `

                <div class="error">

                    Unable to load ticket types.

                    <br><br>

                    ${typesError.message}

                </div>

            `;

            return;

        }



        // Get events

        const { data: events, error: eventsError } =
            await supabaseClient
                .from("events")
                .select("id, title");


        if (eventsError) {

            console.error(
                "Events error:",
                eventsError
            );

        }



        // Clear loading

        ordersList.innerHTML = "";



        // Display orders

        orders.forEach(order => {


            // Find this order's items

            const items =
                orderItems.filter(
                    item =>
                        item.order_id === order.id
                );


            // Find event

            const event =
                events
                    ? events.find(
                        e =>
                            e.id === order.event_id
                    )
                    : null;



            // Ticket HTML

            let ticketHTML = "";


            if (items.length === 0) {

                ticketHTML = `
                    <p>
                        Ticket information unavailable.
                    </p>
                `;

            } else {


                items.forEach(item => {


                    const ticketType =
                        ticketTypes.find(
                            type =>
                                type.id ===
                                item.ticket_type_id
                        );


                    const ticketName =
                        ticketType
                            ? ticketType.name
                            : "Unknown ticket";


                    ticketHTML += `

                        <p>

                            🎫

                            <strong>
                                ${escapeHTML(ticketName)}
                            </strong>

                            × ${item.quantity}

                            — Rs.
                            ${Number(
                                item.unit_price
                            ).toLocaleString()}

                        </p>

                    `;

                });

            }



            // Payment status class

            const status =
                String(
                    order.payment_status || "unknown"
                ).toLowerCase();


            const statusClass =
                ["pending", "paid", "failed", "cancelled"]
                    .includes(status)
                    ? status
                    : "";



            // Create order card

            const orderDiv =
                document.createElement("div");


            orderDiv.className =
                "order";


            orderDiv.innerHTML = `

                <h3>
                    Order #${order.id}
                </h3>


                <p>

                    <strong>
                        Customer:
                    </strong>

                    ${escapeHTML(
                        order.customer_name ||
                        "Not provided"
                    )}

                </p>


                <p>

                    <strong>
                        Email:
                    </strong>

                    ${escapeHTML(
                        order.customer_email ||
                        "Not provided"
                    )}

                </p>


                <p>

                    <strong>
                        Phone:
                    </strong>

                    ${escapeHTML(
                        order.customer_phone ||
                        "Not provided"
                    )}

                </p>


                <p>

                    <strong>
                        Event:
                    </strong>

                    ${escapeHTML(
                        event
                            ? event.title
                            : "Event #" +
                              order.event_id
                    )}

                </p>


                ${ticketHTML}


                <p>

                    <strong>
                        Total:
                    </strong>

                    Rs.
                    ${Number(
                        order.total_amount || 0
                    ).toLocaleString()}

                </p>


                <p>

                    <strong>
                        Payment:
                    </strong>

                    <span class="status ${statusClass}">

                        ${escapeHTML(
                            order.payment_status ||
                            "unknown"
                        )}

                    </span>

                </p>


                <p>

                    <strong>
                        Payment Reference:
                    </strong>

                    ${escapeHTML(
                        order.payment_ref ||
                        "Not available"
                    )}

                </p>


                <p>

                    <strong>
                        Order Created:
                    </strong>

                    ${formatDate(
                        order.created_at
                    )}

                </p>

            `;


            ordersList.appendChild(orderDiv);

        });

    }



    // =====================================================
    // LOAD DASHBOARD STATS
    // =====================================================

    async function loadStats() {


        // Get orders

        const { data: orders, error: ordersError } =
            await supabaseClient
                .from("orders")
                .select(
                    "id, total_amount, payment_status"
                );


        if (ordersError) {

            console.error(
                "Stats orders error:",
                ordersError
            );

            return;

        }



        // Get order items

        const { data: items, error: itemsError } =
            await supabaseClient
                .from("order_items")
                .select(
                    "quantity, order_id"
                );


        if (itemsError) {

            console.error(
                "Stats items error:",
                itemsError
            );

            return;

        }



        // Calculate

        let ticketsSold = 0;

        let revenue = 0;



        items.forEach(item => {


            const order =
                orders.find(
                    o =>
                        o.id === item.order_id
                );


            // Only PAID orders count

            if (
                order &&
                order.payment_status === "paid"
            ) {

                ticketsSold +=
                    Number(item.quantity);

            }

        });



        orders.forEach(order => {


            if (
                order.payment_status === "paid"
            ) {

                revenue +=
                    Number(order.total_amount || 0);

            }

        });



        // Update dashboard

        document.getElementById("ticketsSold")
            .textContent = ticketsSold;


        document.getElementById("revenue")
            .textContent =
            "Rs. " +
            revenue.toLocaleString();

    }



    // =====================================================
    // MANAGE EVENT
    // =====================================================

    function manageEvent(eventID) {

        window.location.href =
            "event-admin.html?event=" +
            eventID;

    }



    // =====================================================
    // SECURITY HELPER
    // =====================================================

    function escapeHTML(value) {

        if (value === null || value === undefined) {

            return "";

        }


        return String(value)

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");

    }



    // =====================================================
    // DATE FORMAT
    // =====================================================

    function formatDate(value) {

        if (!value) {

            return "Not available";

        }


        const date =
            new Date(value);


        if (isNaN(date.getTime())) {

            return value;

        }


        return date.toLocaleString();

    }



    // =====================================================
    // START DASHBOARD
    // =====================================================

    async function startDashboard() {

        await loadEvents();

        await loadOrders();

        await loadStats();

    }


    startDashboard();


</script>


</body>

</html>
