<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SLFN Admin Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff7fb;
            color: #333;
        }

        header {
            background: #f4c542;
            padding: 20px;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 5px;
            font-size: 14px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 25px;
            font-weight: bold;
        }

        section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        section h2 {
            margin-bottom: 20px;
        }

        .event-card {
            background: #fff1f7;
            padding: 20px;
            border-radius: 12px;
        }

        .event-card h3 {
            margin-bottom: 8px;
        }

        .event-card p {
            margin-bottom: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #f4c542;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.85;
        }

        .empty {
            color: #777;
        }

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>SLFN Admin</h1>

    <p>Sri Lankan Fandom Network</p>

</header>


<div class="container">


    <!-- DASHBOARD STATS -->

    <div class="stats">

        <div class="stat-card">

            <h3>Active Events</h3>

            <p>1</p>

        </div>


        <div class="stat-card">

            <h3>Tickets Sold</h3>

            <p>0</p>

        </div>


        <div class="stat-card">

            <h3>Revenue</h3>

            <p>Rs. 0</p>

        </div>

    </div>



    <!-- EVENTS -->

    <section>

        <h2>Events</h2>


        <div class="event-card">

            <h3>Echoes of Siam 2026</h3>

            <p>Tickets Sold: 0</p>

            <p>Revenue: Rs. 0</p>

            <button onclick="manageEvent()">
                Manage Event
            </button>

        </div>

    </section>



    <!-- ORDERS -->

    <section>

        <h2>Orders</h2>

        <p class="empty">
            No orders yet.
        </p>

    </section>



    <!-- CHECK-IN -->

    <section>

        <h2>Check-in</h2>

        <p class="empty">
            No tickets checked in yet.
        </p>

    </section>


</div>


<script>

    function manageEvent() {

        alert("Event management will be added next.");

    }

</script>


</body>

</html>
