<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SLFN Admin Dashboard</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff7fb;
            color: #333;
        }

        header {
            background: #f4c542;
            padding: 20px;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 5px;
            font-size: 14px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 25px;
            font-weight: bold;
        }

        section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        section h2 {
            margin-bottom: 20px;
        }

        .event-card {
            background: #fff1f7;
            padding: 20px;
            border-radius: 12px;
        }

        .event-card h3 {
            margin-bottom: 8px;
        }

        .event-card p {
            margin-bottom: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #f4c542;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.85;
        }

        .order {
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .order strong {
            display: inline-block;
            margin-bottom: 5px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #fff3cd;
            font-size: 12px;
            margin-top: 5px;
        }

        .empty {
            color: #777;
        }

        .error {
            color: #c00;
            background: #ffe5e5;
            padding: 12px;
            border-radius: 8px;
        }

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>SLFN Admin</h1>

    <p>Sri Lankan Fandom Network</p>

</header>


<div class="container">


    <!-- DASHBOARD STATS -->

    <div class="stats">

        <div class="stat-card">

            <h3>Active Events</h3>

            <p id="activeEvents">1</p>

        </div>


        <div class="stat-card">

            <h3>Tickets Sold</h3>

            <p id="ticketsSold">0</p>

        </div>


        <div class="stat-card">

            <h3>Revenue</h3>

            <p id="revenue">Rs. 0</p>

        </div>

    </div>



    <!-- EVENTS -->

    <section>

        <h2>Events</h2>

        <div class="event-card">

            <h3>Echoes of Siam 2026</h3>

            <p>Tickets Sold: 0</p>

            <p>Revenue: Rs. 0</p>

            <button onclick="manageEvent('eos')">
                Manage Event
            </button>

        </div>

    </section>



    <!-- ORDERS -->

    <section>

        <h2>Orders</h2>

        <div id="ordersList">

            <p class="empty">
                Loading orders...
            </p>

        </div>

    </section>



    <!-- CHECK-IN -->

    <section>

        <h2>Check-in</h2>

        <p class="empty">
            No tickets checked in yet.
        </p>

    </section>


</div>



<script>


    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL = "https://ixjzimaqsgrpcwzidcgx.supabase.co";

    const SUPABASE_KEY = "sb_publishable_DKTtTNjxkbrsWzQYqm_EEA_2Q6TLzZI";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );



    // ==========================================
    // LOAD ORDERS
    // ==========================================

  async function loadStats() {

    // Get all order items
    const { data: items, error: itemsError } =
        await supabaseClient
            .from("order_items")
            .select("quantity, order_id");


    if (itemsError) {

        console.error(itemsError);

        return;

    }


    // Get all orders
    const { data: orders, error: ordersError } =
        await supabaseClient
            .from("orders")
            .select("id, total_amount, payment_status");


    if (ordersError) {

        console.error(ordersError);

        return;

    }


    // ------------------------------------------
    // TICKETS SOLD
    // ------------------------------------------

    let ticketsSold = 0;


    items.forEach(item => {

        const order =
            orders.find(o => o.id === item.order_id);


        // Only count tickets from paid orders
        if (order && order.payment_status === "paid") {

            ticketsSold += Number(item.quantity);

        }

    });


    // ------------------------------------------
    // REVENUE
    // ------------------------------------------

    let revenue = 0;


    orders.forEach(order => {

        if (order.payment_status === "paid") {

            revenue += Number(order.total_amount);

        }

    });


    // ------------------------------------------
    // UPDATE DASHBOARD
    // ------------------------------------------

    document.getElementById("ticketsSold")
        .textContent = ticketsSold;


    document.getElementById("revenue")
        .textContent =
        "Rs. " + revenue.toLocaleString();

}



    // ==========================================
    // CALCULATE BASIC ORDER STATS
    // ==========================================

    async function loadStats() {

        const { data, error } = await supabaseClient
            .from("orders")
            .select("total_amount, payment_status");


        if (error) {

            console.error(error);

            return;

        }


        let ticketsSold = 0;

        let revenue = 0;


        data.forEach(order => {

            /*
             * For now each order is counted as one
             * because ticket quantity is stored in
             * order_items, which we'll connect next.
             */

            if (order.payment_status === "paid") {

                ticketsSold++;

                revenue += Number(order.total_amount);

            }

        });


        document.getElementById("ticketsSold")
            .textContent = ticketsSold;


        document.getElementById("revenue")
            .textContent =
            "Rs. " + revenue.toLocaleString();

    }



    // ==========================================
    // MANAGE EVENT
    // ==========================================

    function manageEvent(eventID) {

        window.location.href =
            "event-admin.html?event=" + eventID;

    }



    // ==========================================
    // START
    // ==========================================

    loadOrders();

    loadStats();


</script>


</body>

</html>
